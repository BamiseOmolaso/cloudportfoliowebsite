name: Build and publish images

# Builds the two container images the Kubernetes cluster runs:
#   app      -> the Next.js website        (Dockerfile target "runner")
#   migrator -> applies database migrations (Dockerfile target "migrator")
# On a pull request we only BUILD (proves the Dockerfile works).
# On a push to staging we also PUSH to GitHub's registry (GHCR), tagged with
# the commit, so the cluster can pull exactly that version.
on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'prisma/**'
      - 'src/**'
      - 'public/**'
      - 'next.config.*'
      - '.github/workflows/build-image.yml'
  # Only a commit that changes the website needs a new image. A docs, infrastructure or release
  # commit would build and publish an identical image for nothing. (To build by hand, use
  # "Run workflow": workflow_dispatch below.) A release then names the newest commit that HAS an
  # image, which is the last one that changed the website.
  push:
    branches: [staging]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'prisma/**'
      - 'src/**'
      - 'public/**'
      - 'next.config.*'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # lets this job push to ghcr.io with the built-in token
      security-events: write # lets the scan below publish its findings to the Security tab
      id-token: write # lets the signing step prove "this build came from this workflow" (no keys to store)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            target: runner
            suffix: ''
          - name: migrator
            target: migrator
            suffix: '-migrator'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Registry names must be lowercase; the GitHub owner name may not be.
      - name: Compute image name
        id: img
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/cloudportfoliowebsite${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Build (and push on staging)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          # Attach a list of everything inside the image (SBOM) and a build record (provenance).
          sbom: ${{ github.event_name != 'pull_request' }}
          # The build record cannot be loaded into the runner's Docker, which the PR scan needs.
          provenance: ${{ github.event_name == 'pull_request' && 'false' || 'mode=max' }}
          # On a pull request, keep the image on the runner so the gate below can scan it.
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_* values are baked into the browser bundle at build
          # time. They are public by design, so they live in repo variables.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
            NEXT_PUBLIC_GA_ID=${{ vars.NEXT_PUBLIC_GA_ID }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Sign the image by its digest. The signature says "built by this repository's workflow on
      # this branch" and is stored next to the image in GHCR. Nothing checks it yet (a later step
      # adds a cluster rule that refuses unsigned images), so this cannot break a deployment.
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless)
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}"

      # THE GATE. On a pull request, scan the image this change would produce and FAIL on any
      # CRITICAL weakness that has a fix available. HIGH is reported after merge (below) but does
      # not block, because today's HIGH items all come from the operating system inside the base
      # image, which a pull request to our code cannot fix. Raise this to CRITICAL,HIGH once the
      # base image is clean.
      - name: Block critical vulnerabilities (Trivy)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.name }}:${{ steps.meta.outputs.version }}
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      # A tag can be moved to a different image; a digest (a fingerprint of the contents)
      # cannot. Print the exact line a release should put in the manifests.
      - name: Show the immutable image reference
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### ${{ matrix.name }} image"
            echo
            echo "Put this in the release PR (tag for people, digest for the cluster):"
            echo
            echo '```'
            echo "image: ${{ steps.img.outputs.name }}:${{ steps.meta.outputs.version }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Signed with cosign (keyless). Verify with:"
            echo
            echo '```'
            echo "cosign verify ${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Keep the exact reference as a small file so `scripts/release.sh` can open the release pull
      # request without anyone copying digests by hand.
      - name: Save the image reference for the release script
        if: github.event_name != 'pull_request'
        run: echo "${{ steps.img.outputs.name }}:${{ steps.meta.outputs.version }}@${{ steps.build.outputs.digest }}" > image.txt

      - name: Upload the image reference
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: image.txt
          retention-days: 30

      # Scan the image that was just published (the one that will run), not a copy. Findings
      # appear under Security > Code scanning. This reports and does not block: a newly found
      # weakness in a base image must not stop a release. Only HIGH and CRITICAL issues that
      # have a fix are shown.
      - name: Scan the published image for known vulnerabilities (Trivy)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          # By digest, so the scan covers exactly the bytes that were published.
          image-ref: ${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-${{ matrix.name }}.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload the scan results to GitHub Security
        if: github.event_name != 'pull_request' && hashFiles(format('trivy-{0}.sarif', matrix.name)) != ''
        uses: github/codeql-action/upload-sarif@52485aec7be33610227643b0fe83936b8b5f061a  # v3
        with:
          sarif_file: 'trivy-${{ matrix.name }}.sarif'
          category: 'trivy-${{ matrix.name }}'
