name: Build and publish images

# Builds the two container images the Kubernetes cluster runs:
#   app      -> the Next.js website        (Dockerfile target "runner")
#   migrator -> applies database migrations (Dockerfile target "migrator")
# On a pull request we only BUILD (proves the Dockerfile works).
# On a push to develop we also PUSH to GitHub's registry (GHCR), tagged with
# the commit, so the cluster can pull exactly that version.
on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'prisma/**'
      - 'src/**'
      - 'public/**'
      - 'next.config.*'
      - '.github/workflows/build-image.yml'
  # Only a commit that changes the website needs a new image. A docs, infrastructure or release
  # commit would build and publish an identical image for nothing. (To build by hand, use
  # "Run workflow": workflow_dispatch below.) A release then names the newest commit that HAS an
  # image, which is the last one that changed the website.
  push:
    branches: [develop]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'prisma/**'
      - 'src/**'
      - 'public/**'
      - 'next.config.*'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # lets this job push to ghcr.io with the built-in token
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            target: runner
            suffix: ''
          - name: migrator
            target: migrator
            suffix: '-migrator'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Registry names must be lowercase; the GitHub owner name may not be.
      - name: Compute image name
        id: img
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/cloudportfoliowebsite${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Build (and push on develop)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_* values are baked into the browser bundle at build
          # time. They are public by design, so they live in repo variables.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
            NEXT_PUBLIC_GA_ID=${{ vars.NEXT_PUBLIC_GA_ID }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
