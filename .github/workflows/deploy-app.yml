        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false
      
      - name: Get ECS Service Info
        id: ecs
        run: |
          cd terraform/envs/prod
          terraform init -input=false
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          SERVICE=$(terraform output -raw ecs_service_name)
          echo "cluster_name=$CLUSTER" >> $GITHUB_OUTPUT
          echo "service_name=$SERVICE" >> $GITHUB_OUTPUT
      
      - name: Verify Docker image exists in ECR
        run: |
          ECR_REPO=${{ needs.build-and-push.outputs.ecr_repository }}
          IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
          
          echo "🔍 Verifying image exists: $ECR_REPO:$IMAGE_TAG"
          
          # Extract repository name from full URL
          REPO_NAME=$(echo "$ECR_REPO" | sed 's|.*/||')
          
          # Check if image exists with the specific tag
          if aws ecr describe-images \
            --repository-name "$REPO_NAME" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "✅ Image $ECR_REPO:$IMAGE_TAG exists in ECR"
          else
            echo "❌ Image $ECR_REPO:$IMAGE_TAG NOT FOUND in ECR!"
            echo ""
            echo "📋 Checking available images and tags in repository:"
            # Get all images with their tags
            IMAGES=$(aws ecr describe-images \
              --repository-name "$REPO_NAME" \
              --region ${{ env.AWS_REGION }} \
              --query 'imageDetails[*].[imageTags, imagePushedAt]' \
              --output json 2>/dev/null || echo "[]")
            
            if [ "$IMAGES" != "[]" ] && [ -n "$IMAGES" ]; then
              echo "$IMAGES" | jq -r '.[] | "Tags: \(.[0] // ["<untagged>"]) | Pushed: \(.[1])"' || echo "$IMAGES"
            else
              echo "No images found or could not list images"
            fi
            echo ""
            echo "💡 Possible solutions:"
            echo "   1. Check if build-and-push job ran and succeeded"
            echo "   2. Use latest image if available:"
            echo "      aws ecs update-service --cluster <cluster> --service <service> --force-new-deployment"
            echo "   3. Check build-and-push job logs for actual tags pushed"
            echo ""
            echo "🔍 Build-and-push job status: ${{ needs.build-and-push.result }}"
            if [ "${{ needs.build-and-push.result }}" != "success" ]; then
              echo "❌ build-and-push job did not succeed!"
              echo "   Please check the build-and-push job logs and fix any errors"
            else
              echo "✅ build-and-push job succeeded, but image tag mismatch"
              echo "   Expected tag: $IMAGE_TAG"
              echo "   This may be a timing issue - try re-running the workflow"
            fi
            exit 1
          fi
      
      - name: Register new task definition with new image
        id: register-td
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          ECR_REPO: ${{ needs.build-and-push.outputs.ecr_repository }}
          CLUSTER: ${{ steps.ecs.outputs.cluster_name }}
          SERVICE: ${{ steps.ecs.outputs.service_name }}
        run: |
          TD_FAMILY=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --region "$AWS_REGION" --query 'services[0].taskDefinition' --output text \
            | awk -F'/' '{print $NF}' | awk -F':' '{print $1}')
          CURRENT=$(aws ecs describe-task-definition --task-definition "$TD_FAMILY" \
            --region "$AWS_REGION" --query 'taskDefinition' --output json)
          NEW=$(echo "$CURRENT" | jq --arg img "${ECR_REPO}:${IMAGE_TAG}" '
            .containerDefinitions[0].image = $img
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ')
          # aws CLI's --cli-input-json doesn't reliably consume a shell pipe
          # via file:///dev/stdin (it reproduces "Invalid JSON received" even
          # when stdin contains valid JSON). Use an explicit tempfile.
          TMP_TD=$(mktemp)
          trap 'rm -f "$TMP_TD"' EXIT
          printf '%s' "$NEW" > "$TMP_TD"
          NEW_ARN=$(aws ecs register-task-definition --region "$AWS_REGION" \
            --cli-input-json "file://$TMP_TD" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered: $NEW_ARN"
          echo "task_def_arn=$NEW_ARN" >> "$GITHUB_OUTPUT"

      - name: Update ECS service to use new task definition
        run: |
          aws ecs update-service \
            --cluster ${{ steps.ecs.outputs.cluster_name }} \
            --service ${{ steps.ecs.outputs.service_name }} \
            --task-definition ${{ steps.register-td.outputs.task_def_arn }} \
            --region ${{ env.AWS_REGION }} \
            --query 'service.deployments[0].{Status:status,Rollout:rolloutState}' \
            --output table
      
      - name: Wait for ECS Service to Stabilize
        run: |
          echo "⏳ Waiting for ECS service to stabilize (max 10 minutes)..."
          timeout 600 aws ecs wait services-stable \
            --cluster ${{ steps.ecs.outputs.cluster_name }} \
            --services ${{ steps.ecs.outputs.service_name }} \
            --region ${{ env.AWS_REGION }} || {
              echo "⚠️ Service stabilization timeout or error"
              echo "Checking service status..."
              aws ecs describe-services \
                --cluster ${{ steps.ecs.outputs.cluster_name }} \
                --services ${{ steps.ecs.outputs.service_name }} \
                --region ${{ env.AWS_REGION }} \
                --query 'services[0].{Status:status,Running:runningCount,Desired:desiredCount,Events:events[0:3]}' \
                --output json
              exit 1
            }
          echo "✅ ECS service is stable"
      
      - name: Verify Deployment
        run: |
          cd terraform/envs/prod
          ALB_DNS=$(terraform output -raw alb_dns_name)
          
          # Health check
          MAX_RETRIES=30
          RETRY_COUNT=0
          
          # -L follows the 301 the HTTP:80 listener now issues to HTTPS:443.
          # -k skips TLS verification because the ACM cert is for the custom
          # domain (portfolio.oluwabamiseomolaso.com.ng), not the ALB DNS name
          # we hit here — name mismatch is expected, not a real failure.
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HTTP_CODE=$(curl -sk -L -o /dev/null -w "%{http_code}" "http://$ALB_DNS/api/health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed"
              exit 0
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "⏳ Waiting for health check... ($RETRY_COUNT/$MAX_RETRIES) - HTTP $HTTP_CODE"
            sleep 10
          done
          
          echo "❌ Health check failed after $MAX_RETRIES attempts"
          exit 1

