name: Deploy Application

on:
  # Run after CI passes — restricted to main only. develop and staging
  # branches exist as code-review stages and run CI but do not deploy.
  # Keeping AWS infrastructure cost to a single environment (prod).
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main
  # Manual trigger (for emergency deployments or testing)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev/staging/prod)'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      image_tag:
        description: 'Docker image tag (leave empty for commit SHA)'
        required: false
        type: string

env:
  AWS_REGION: us-east-1

jobs:
  # ============================================
  # Build & Push Docker Image
  # ============================================
  
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    # Only run if CI passed (when triggered by workflow_run) or manual dispatch.
    # The workflow_run guard requires the upstream run to come from the SAME repository
    # (not a fork) and to have been triggered by a push, so a malicious fork-push cannot
    # cause a downstream deploy with our secrets.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
      id-token: write
      security-events: write
    outputs:
      image_tag: ${{ steps.image-tag.outputs.IMAGE_TAG }}
      image_digest: ${{ steps.build.outputs.digest }}
      ecr_repository: ${{ steps.ecr.outputs.ECR_URL }}
      environment: ${{ steps.env.outputs.ENV_NAME }}
    
    steps:
      - name: Check CI Status (if triggered by workflow_run)
        if: github.event_name == 'workflow_run'
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "❌ CI Pipeline failed. Skipping deployment."
            echo "CI Conclusion: ${{ github.event.workflow_run.conclusion }}"
            exit 1
          fi
          echo "✅ CI Pipeline passed. Proceeding with deployment."
      
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Select environment
        id: env
        run: |
          if [[ "${{ github.event.inputs.environment }}" != "" ]]; then
            ENV_NAME="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref_name }}" == "develop" ]]; then
            ENV_NAME="dev"
          elif [[ "${{ github.ref_name }}" == "staging" ]]; then
            ENV_NAME="staging"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            ENV_NAME="prod"
          else
            ENV_NAME="dev"
          fi
          echo "ENV_NAME=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "Selected environment: $ENV_NAME"
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false
      
      - name: Set AWS role ARN
        id: aws-role
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -n "$ROLE_ARN" ] && [[ "$ROLE_ARN" =~ ^arn:aws:iam::[0-9]+:role/ ]]; then
            echo "role_arn=$ROLE_ARN" >> $GITHUB_OUTPUT
            echo "use_oidc=true" >> $GITHUB_OUTPUT
          else
            echo "use_oidc=false" >> $GITHUB_OUTPUT
            if [ -n "$ROLE_ARN" ]; then
              echo "⚠️ Warning: ROLE_ARN is set but not in valid ARN format"
            fi
          fi
      
      - name: Configure AWS credentials (OIDC)
        if: steps.aws-role.outputs.use_oidc == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.aws-role.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: docker-build-${{ github.run_id }}
          role-skip-session-tagging: false
      
      - name: Configure AWS credentials (Access Keys)
        if: steps.aws-role.outputs.use_oidc == 'false'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Get ECR Repository URL
        id: ecr
        run: |
          cd terraform/envs/${{ steps.env.outputs.ENV_NAME }}
          
          # Initialize Terraform (backend config is already in backend.tf)
          terraform init -input=false
          
          # Get ECR URL from outputs
          ECR_URL=$(terraform output -raw ecr_repository_url 2>/dev/null || echo "")
          if [ -z "$ECR_URL" ]; then
            echo "⚠️  ECR repository not found. Infrastructure may not be deployed yet."
            echo "ECR_URL=" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "ECR_URL=$ECR_URL" >> $GITHUB_OUTPUT
            echo "✅ Found ECR repository: $ECR_URL"
          fi
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Set image tag
        id: image-tag
        run: |
          if [[ "${{ github.event.inputs.image_tag }}" != "" ]]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="${GITHUB_SHA::7}"
          fi
          echo "IMAGE_TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Using image tag: $TAG"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr.outputs.ECR_URL }}
          tags: |
            type=raw,value=${{ steps.image-tag.outputs.IMAGE_TAG }}
            type=raw,value=latest
        if: steps.ecr.outputs.ECR_URL != ''
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
        if: steps.ecr.outputs.ECR_URL != ''
      
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
        continue-on-error: true
        if: steps.ecr.outputs.ECR_URL != ''

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@52485aec7be33610227643b0fe83936b8b5f061a  # v3
        if: hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================
  # Deploy to ECS
  # ============================================
  
  deploy-ecs-dev:
    name: Deploy to ECS - Dev
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: |
      (github.ref_name == 'develop' || github.event.inputs.environment == 'dev') &&
      needs.build-and-push.outputs.ecr_repository != '' &&
      needs.build-and-push.result == 'success'
    environment:
      name: development
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false
      
      - name: Set AWS role ARN
        id: aws-role
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -n "$ROLE_ARN" ] && [[ "$ROLE_ARN" =~ ^arn:aws:iam::[0-9]+:role/ ]]; then
            echo "role_arn=$ROLE_ARN" >> $GITHUB_OUTPUT
            echo "use_oidc=true" >> $GITHUB_OUTPUT
          else
            echo "use_oidc=false" >> $GITHUB_OUTPUT
            if [ -n "$ROLE_ARN" ]; then
              echo "⚠️ Warning: ROLE_ARN is set but not in valid ARN format"
            fi
          fi
      
      - name: Configure AWS credentials (OIDC)
        if: steps.aws-role.outputs.use_oidc == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.aws-role.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ecs-deploy-dev-${{ github.run_id }}
          role-skip-session-tagging: false
      
      - name: Configure AWS credentials (Access Keys)
        if: steps.aws-role.outputs.use_oidc == 'false'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Get ECS Service Info
        id: ecs
        run: |
          cd terraform/envs/dev
          terraform init -input=false
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          SERVICE=$(terraform output -raw ecs_service_name)
          echo "cluster_name=$CLUSTER" >> $GITHUB_OUTPUT
          echo "service_name=$SERVICE" >> $GITHUB_OUTPUT
      
      - name: Verify Docker image exists in ECR
        run: |
          ECR_REPO=${{ needs.build-and-push.outputs.ecr_repository }}
          IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
          
          echo "🔍 Verifying image exists: $ECR_REPO:$IMAGE_TAG"
          
          # Extract repository name from full URL
          REPO_NAME=$(echo "$ECR_REPO" | sed 's|.*/||')
          
          # Check if image exists with the specific tag
          if aws ecr describe-images \
            --repository-name "$REPO_NAME" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "✅ Image $ECR_REPO:$IMAGE_TAG exists in ECR"
          else
            echo "❌ Image $ECR_REPO:$IMAGE_TAG NOT FOUND in ECR!"
            echo ""
            echo "📋 Checking available images and tags in repository:"
            # Get all images with their tags
            IMAGES=$(aws ecr describe-images \
              --repository-name "$REPO_NAME" \
              --region ${{ env.AWS_REGION }} \
              --query 'imageDetails[*].[imageTags, imagePushedAt]' \
              --output json 2>/dev/null || echo "[]")
            
            if [ "$IMAGES" != "[]" ] && [ -n "$IMAGES" ]; then
              echo "$IMAGES" | jq -r '.[] | "Tags: \(.[0] // ["<untagged>"]) | Pushed: \(.[1])"' || echo "$IMAGES"
            else
              echo "No images found or could not list images"
            fi
            echo ""
            echo "💡 Possible solutions:"
            echo "   1. Check if build-and-push job ran and succeeded"
            echo "   2. Use latest image if available:"
            echo "      aws ecs update-service --cluster <cluster> --service <service> --force-new-deployment"
            echo "   3. Check build-and-push job logs for actual tags pushed"
            echo ""
            echo "🔍 Build-and-push job status: ${{ needs.build-and-push.result }}"
            if [ "${{ needs.build-and-push.result }}" != "success" ]; then
              echo "❌ build-and-push job did not succeed!"
              echo "   Please check the build-and-push job logs and fix any errors"
            else
              echo "✅ build-and-push job succeeded, but image tag mismatch"
              echo "   Expected tag: $IMAGE_TAG"
              echo "   This may be a timing issue - try re-running the workflow"
            fi
            exit 1
          fi
      
      # Register a new task-definition revision with the updated image, then
      # point the ECS service at it via aws-cli. We deliberately avoid
      # `terraform apply` here: terraform would reconcile every drifted
      # resource (operator-only tfvars not in CI), and the deploy_role lacks
      # iam:UpdateAssumeRolePolicy / ec2:RevokeSecurityGroupIngress / etc.
      # by Phase 3 design. Infrastructure changes are the job of
      # terraform.yml, not deploy-app.yml.
      - name: Register new task definition with new image
        id: register-td
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          ECR_REPO: ${{ needs.build-and-push.outputs.ecr_repository }}
          CLUSTER: ${{ steps.ecs.outputs.cluster_name }}
          SERVICE: ${{ steps.ecs.outputs.service_name }}
        run: |
          TD_FAMILY=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --region "$AWS_REGION" --query 'services[0].taskDefinition' --output text \
            | awk -F'/' '{print $NF}' | awk -F':' '{print $1}')
          CURRENT=$(aws ecs describe-task-definition --task-definition "$TD_FAMILY" \
            --region "$AWS_REGION" --query 'taskDefinition' --output json)
          NEW=$(echo "$CURRENT" | jq --arg img "${ECR_REPO}:${IMAGE_TAG}" '
            .containerDefinitions[0].image = $img
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ')
          # aws CLI's --cli-input-json doesn't reliably consume a shell pipe
          # via file:///dev/stdin (it reproduces "Invalid JSON received" even
          # when stdin contains valid JSON). Use an explicit tempfile.
          TMP_TD=$(mktemp)
          trap 'rm -f "$TMP_TD"' EXIT
          printf '%s' "$NEW" > "$TMP_TD"
          NEW_ARN=$(aws ecs register-task-definition --region "$AWS_REGION" \
            --cli-input-json "file://$TMP_TD" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered: $NEW_ARN"
          echo "task_def_arn=$NEW_ARN" >> "$GITHUB_OUTPUT"

      - name: Update ECS service to use new task definition
        run: |
          aws ecs update-service \
            --cluster ${{ steps.ecs.outputs.cluster_name }} \
            --service ${{ steps.ecs.outputs.service_name }} \
            --task-definition ${{ steps.register-td.outputs.task_def_arn }} \
            --region ${{ env.AWS_REGION }} \
            --query 'service.deployments[0].{Status:status,Rollout:rolloutState}' \
            --output table
      
      - name: Wait for ECS Service to Stabilize
        run: |
          echo "⏳ Waiting for ECS service to stabilize (max 10 minutes)..."
          timeout 600 aws ecs wait services-stable \
            --cluster ${{ steps.ecs.outputs.cluster_name }} \
            --services ${{ steps.ecs.outputs.service_name }} \
            --region ${{ env.AWS_REGION }} || {
              echo "⚠️ Service stabilization timeout or error"
              echo "Checking service status..."
              aws ecs describe-services \
                --cluster ${{ steps.ecs.outputs.cluster_name }} \
                --services ${{ steps.ecs.outputs.service_name }} \
                --region ${{ env.AWS_REGION }} \
                --query 'services[0].{Status:status,Running:runningCount,Desired:desiredCount,Events:events[0:3]}' \
                --output json
              exit 1
            }
          echo "✅ ECS service is stable"

  deploy-ecs-staging:
    name: Deploy to ECS - Staging
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: |
      (github.ref_name == 'staging' || github.event.inputs.environment == 'staging') &&
      needs.build-and-push.outputs.ecr_repository != '' &&
      needs.build-and-push.result == 'success'
    environment:
      name: staging
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Setup Terraform
