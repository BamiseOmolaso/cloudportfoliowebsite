name: Hetzner Infrastructure

# Same shape as the AWS pipeline: checks on every PR, a plan to review, and
# an apply that only runs from main after a human approves it.
on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra.yml'
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
  workflow_dispatch:

env:
  TF_VERSION: 1.14.6
  TF_DIR: infra/terraform/envs/prod
  # Hetzner has no OIDC federation (unlike AWS), so the API token is a
  # repository secret. It is scoped to this one Hetzner project.
  HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
  # R2 is S3-compatible, so the S3 backend reads these standard names.
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  # Cloudflare token for DNS records (scoped to this one zone, DNS edit only).
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
  TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_SSH_PUBLIC_KEY }}
  TF_VAR_admin_cidrs: ${{ secrets.TF_VAR_ADMIN_CIDRS }}
  TF_VAR_server_type: ${{ vars.SERVER_TYPE }}
  TF_VAR_location: ${{ vars.HCLOUD_LOCATION }}

# Never run two Terraform jobs against the same state at once.
concurrency:
  group: hetzner-infra
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # No secrets needed: formatting and syntax only.
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive -diff
        working-directory: infra/terraform

      - name: Init without backend
        run: terraform init -backend=false -input=false
        working-directory: ${{ env.TF_DIR }}

      - name: Validate
        run: terraform validate
        working-directory: ${{ env.TF_DIR }}

  plan:
    name: Plan
    needs: validate
    runs-on: ubuntu-latest
    # Fork PRs and Dependabot PRs get no repository secrets (Dependabot has its own separate
    # secret store), so a plan would fail on empty credentials. They only get the validate job.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write backend config
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          printf 'endpoints = {\n  s3 = "%s"\n}\n' "$R2_ENDPOINT" > backend.hcl
        working-directory: ${{ env.TF_DIR }}

      - name: Init
        run: terraform init -backend-config=backend.hcl -input=false
        working-directory: ${{ env.TF_DIR }}

      - name: Plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan
        working-directory: ${{ env.TF_DIR }}

      - name: Show plan in the run summary
        run: |
          {
            echo '### Terraform plan'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: ${{ env.TF_DIR }}

      # The saved plan is what gets applied, so what you reviewed is exactly
      # what runs. Keep it short-lived.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: github.event_name != 'pull_request'
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 1

  apply:
    name: Apply (needs approval)
    needs: plan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # Configure required reviewers on this environment in GitHub settings.
    environment: hetzner-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}

      - name: Write backend config
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          printf 'endpoints = {\n  s3 = "%s"\n}\n' "$R2_ENDPOINT" > backend.hcl
        working-directory: ${{ env.TF_DIR }}

      - name: Init
        run: terraform init -backend-config=backend.hcl -input=false
        working-directory: ${{ env.TF_DIR }}

      - name: Apply the reviewed plan
        run: terraform apply -input=false -lock-timeout=5m tfplan
        working-directory: ${{ env.TF_DIR }}
