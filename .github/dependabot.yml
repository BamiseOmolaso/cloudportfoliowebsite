# Dependabot opens pull requests (into staging) when something we depend on has a new version.
# The Docker entry matters most: the base image in the Dockerfile is pinned by digest (an
# unchangeable fingerprint), so it only moves when Dependabot proposes a new digest and CI passes.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
