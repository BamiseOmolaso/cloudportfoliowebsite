---
# Terraform already formatted the disk (ext4), so here we only mount it.
- name: Create the mount point
  ansible.builtin.file:
    path: "{{ data_mount_path }}"
    state: directory
    mode: "0755"

# `nofail` matters: without it, a missing disk at boot would stop the whole
# server from starting. `discard` lets the disk reclaim deleted blocks.
- name: Mount the data volume now and on every boot
  ansible.posix.mount:
    src: "{{ data_volume_device }}"
    path: "{{ data_mount_path }}"
    fstype: ext4
    opts: discard,nofail,defaults
    state: mounted

# The database's folder on the disk. Kubernetes cannot fix the ownership of a plain
# host folder for us, and Postgres refuses to start unless its data folder belongs to
# the user it runs as and is private (mode 0700).
- name: Create the Postgres data folder with the right owner
  ansible.builtin.file:
    path: "{{ data_mount_path }}/postgres"
    state: directory
    owner: "{{ postgres_uid }}"
    group: "{{ postgres_gid }}"
    mode: "0700"
