# The test page as ArgoCD deploys it from git. Same app as infra/k8s/hello (the
# step-by-step manual version in docs 03 and 04), but one file with the HTTPS
# Ingress already included, so ArgoCD has exactly one definition of each object.
apiVersion: v1
kind: Namespace
metadata:
  name: hello
  labels:
    # Kubernetes will refuse any pod here that is not locked down.
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          args: ["--port=8080"] # a non-root process cannot use port 80
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: hello
spec:
  selector:
    app: hello
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
  namespace: hello
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - test.oluwabamiseomolaso.com.ng
      secretName: hello-tls # cert-manager creates this Secret and keeps it renewed
  rules:
    - host: test.oluwabamiseomolaso.com.ng
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello
                port:
                  number: 80
