# Who may talk to the database. Without a policy, EVERY pod in the cluster could try.
# Rule 1 denies all incoming connections to this namespace; rule 2 re-allows exactly
# the callers we want, on exactly one port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: postgres
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-clients
  namespace: postgres
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        # The application, which will live in a namespace called "portfolio".
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: portfolio
        # The backup and restore-test pods, in this namespace.
        - podSelector:
            matchLabels:
              app: db-backup
      ports:
        - protocol: TCP
          port: 5432
