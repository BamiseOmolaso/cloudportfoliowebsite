# Nightly backup: dump the database, check the dump is readable, upload it to a
# separate Cloudflare R2 bucket. A "CronJob" is the Kubernetes version of cron.
#
# Two steps, in order, in one pod:
#   1. init container "dump": pg_dump into a scratch folder, then verify the file.
#   2. container "upload": copy the files to R2 with the AWS CLI (R2 speaks the S3 protocol).
# If step 1 fails the pod fails and nothing is uploaded, so a broken dump never
# replaces a good one. Old backups are removed by an R2 lifecycle rule (see docs).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: postgres
spec:
  schedule: "17 2 * * *" # 02:17 UTC every day
  concurrencyPolicy: Forbid # never two backups at once
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800 # give up after 30 minutes
      template:
        metadata:
          labels:
            app: db-backup # lets the network policy allow this pod to reach the database
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534 # "nobody"
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: backup
              emptyDir:
                sizeLimit: 2Gi
            - name: tmp
              emptyDir: {}
          initContainers:
            - name: dump
              image: postgres:17.11-bookworm
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  # The network policy takes a moment to learn about a brand-new pod, so
                  # connections in its first second or two are refused. Wait until the
                  # database is reachable (up to 2 minutes) before doing anything.
                  tries=0
                  until pg_isready --host=postgres --username=postgres --quiet; do
                    tries=$((tries + 1))
                    if [ "$tries" -ge 60 ]; then echo "database not reachable after 2 minutes"; exit 1; fi
                    sleep 2
                  done
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  # Roles and their settings (not part of a single-database dump).
                  pg_dumpall --host=postgres --username=postgres --globals-only > "/backup/globals-${ts}.sql"
                  # The data. "custom" format is compressed and lets pg_restore pick pieces.
                  pg_dump --host=postgres --username=postgres --dbname=portfolio \
                    --format=custom --file="/backup/portfolio-${ts}.dump"
                  # Prove the file is a readable archive before anything is uploaded.
                  pg_restore --list "/backup/portfolio-${ts}.dump" > /dev/null
                  ls -l /backup
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: postgres-password
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: amazon/aws-cli:2.37.8
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  aws s3 cp /backup/ "s3://${BUCKET}/daily/" --recursive --endpoint-url "${R2_ENDPOINT}"
              env:
                - name: HOME
                  value: /tmp
                - name: AWS_DEFAULT_REGION
                  value: auto # R2 has no regions
                # Recent AWS CLI versions add checksum headers some S3-compatible stores
                # reject; only send them when a request requires it.
                - name: AWS_REQUEST_CHECKSUM_CALCULATION
                  value: when_required
                - name: AWS_RESPONSE_CHECKSUM_VALIDATION
                  value: when_required
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup # created by hand: see docs/infra/06
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup
                      key: secret-access-key
                - name: R2_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup
                      key: endpoint
                - name: BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup
                      key: bucket
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
