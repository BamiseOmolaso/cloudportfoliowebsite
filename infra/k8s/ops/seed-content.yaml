# One-off: adds the curated projects (prisma/seed-projects.sql) and the lessons-learnt
# blog posts (prisma/seed-posts.sql) to the live database.
#
# NOT managed by ArgoCD: you run it by hand, once (and again only if you add projects or
# write-ups to the content file). It only INSERTS rows that are missing and never
# overwrites one you have edited in the admin panel, so running it twice is harmless.
#
# The migrator image already contains the prisma folder (and so the SQL file), the
# Prisma command line, and the database address comes from the same Secret as the app.
#
# Run it (from the repo root), using the SAME image tag as infra/k8s/apps/portfolio/20-migrate-job.yaml:
#   TAG=$(grep -o 'migrator:sha-[0-9a-f]*' infra/k8s/apps/portfolio/20-migrate-job.yaml | head -1 | cut -d: -f2)
#   sed "s/sha-REPLACE_ME/$TAG/" infra/k8s/ops/seed-content.yaml | kubectl apply -f -
#   kubectl -n portfolio logs -f job/seed-content -c seed-posts
#   kubectl -n portfolio delete job seed-content
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-content
  namespace: portfolio
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: seed-content
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-projects
          image: ghcr.io/bamiseomolaso/cloudportfoliowebsite-migrator:sha-REPLACE_ME
          command:
            - npx
            - prisma
            - db
            - execute
            - --file
            - prisma/seed-projects.sql
            - --schema
            - prisma/schema.prisma
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: DATABASE_URL
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      containers:
        - name: seed-posts
          image: ghcr.io/bamiseomolaso/cloudportfoliowebsite-migrator:sha-REPLACE_ME
          command:
            - npx
            - prisma
            - db
            - execute
            - --file
            - prisma/seed-posts.sql
            - --schema
            - prisma/schema.prisma
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: DATABASE_URL
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
