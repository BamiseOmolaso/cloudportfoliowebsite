# Two "certificate issuers": who cert-manager asks for certificates, and how it
# proves we own the domain. Apply with your own email filled in (never commit it):
#   sed "s/REPLACE_WITH_YOUR_EMAIL/you@example.com/" infra/k8s/cert-manager/cluster-issuers.yaml | kubectl apply -f -
#
# STAGING issues certificates browsers do not trust but has very generous limits,
# so use it first to test. PRODUCTION issues real, trusted certificates but
# refuses to issue repeatedly if you keep failing (rate limits).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: REPLACE_WITH_YOUR_EMAIL # Let's Encrypt emails you before a certificate expires
    privateKeySecretRef:
      name: letsencrypt-staging-account-key # the account key cert-manager creates and keeps here
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token # created by hand, see docs/infra/04-domain-and-https.md
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: REPLACE_WITH_YOUR_EMAIL
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
