# Replaces the test page's plain-HTTP Ingress with one that serves HTTPS on a real
# hostname. Apply AFTER hello.yaml. The annotation below picks the issuer: it starts
# on staging; switch it to letsencrypt-prod once staging works (see
# docs/infra/04-domain-and-https.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello # same name as in hello.yaml, so this replaces it
  namespace: hello
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - test.oluwabamiseomolaso.com.ng
      secretName: hello-tls # cert-manager creates this Secret and keeps it renewed
  rules:
    - host: test.oluwabamiseomolaso.com.ng
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello
                port:
                  number: 80
