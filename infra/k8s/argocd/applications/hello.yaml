apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello
  namespace: argocd
  finalizers:
    # If this Application is deleted, ArgoCD also deletes what it deployed.
    # Right for a stateless test page. NOT for databases: never add this to Postgres.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: portfolio
  source:
    repoURL: https://github.com/BamiseOmolaso/cloudportfoliowebsite.git
    # The branch ArgoCD watches. See docs/infra/05-argocd-gitops.md for why this is
    # `develop` for now, and when it moves to `main`.
    targetRevision: develop
    path: infra/k8s/apps/hello
  destination:
    server: https://kubernetes.default.svc
    namespace: hello
  syncPolicy:
    automated:
      prune: true # delete things that were removed from git
      selfHeal: true # undo changes made by hand in the cluster
